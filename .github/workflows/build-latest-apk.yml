name: Build latest Foot Golf APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.7 and Android templates
        run: bash tools/scripts/install_godot.sh "$HOME/godot" --templates
      - name: Configure Android debug signing
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" builds
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Import Godot resources
        run: "$HOME/godot/godot" --headless --path . --editor --import --quit
      - name: Export latest debug APK
        run: "$HOME/godot/godot" --headless --path . --export-debug Android builds/football-golf-latest-debug.apk
      - name: Verify APK structure and signature
        run: bash tools/scripts/verify_apk.sh builds/football-golf-latest-debug.apk "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: football-golf-latest-debug-apk
          path: builds/football-golf-latest-debug.apk
          if-no-files-found: error
          retention-days: 14
